[workspace]
authors = ["Lee Penkman <leepenkman@gmail.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "mojo-construct"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
build = "bash build/build.sh"
test = "python -m pytest tests -q"
bench = "flock /tmp/mojo-bench.lock python bench/bench.py"

[activation.env]
PYTHONPATH = "python"

[dependencies]
mojo = "==1.2.0.dev2026092605"
# Ships lib/mojo/{max,algorithm}.mojoc. MOJO_NOTES 5b: without it the
# `max.algorithm` import fails. max-core (not `max`) keeps Python at 3.13.
max-core = "==26.7.0.dev2026092605"
python = "3.13.*"
pytest = "*"
numpy = "*"
construct = "==2.10.70"
